events {
    worker_connections 1024;
}

http {
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m inactive=60m max_size=100m;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # WebSocket helper
    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # upstreams
    upstream grafana {
        server grafana:3000;
    }

    upstream server {
        server server:4000;
    }

    upstream client {
        server client:3000;
    }

    # ────────────────────────────────────────────────────────────────
    # Default HTTP (app + API)
    server {
        listen 80;
        server_name _;

        location /api/ {
            proxy_pass http://server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Support /grafana (no slash) → /grafana/ (trailing slash)
        location = /grafana {
            return 301 /grafana/;
        }

        location ^~ /grafana/ {         # ^~ stops later regex checks
            proxy_pass http://grafana;  # ← keep the slashless form from last step
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Generic asset cache – but NOT inside /grafana
        location ~* ^/(?!grafana/).*?\.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|otf|svg|eot)$ {
            expires 10m;
            proxy_cache static_cache;
            proxy_pass http://client;
        }

        location / {
            proxy_pass http://client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|otf|svg|eot)$ {
            expires 10m;
            proxy_cache static_cache;
            proxy_pass http://client;
        }
    }

    # ────────────────────────────────────────────────────────────────
    # Default HTTPS (app + API)
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        location /api/ {
            proxy_pass http://server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Support /grafana (no slash) → /grafana/ (trailing slash)
        location = /grafana {
            return 301 /grafana/;
        }

        location ^~ /grafana/ {         # ^~ stops later regex checks
            proxy_pass http://grafana;  # ← keep the slashless form from last step
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        # Generic asset cache – but NOT inside /grafana
        location ~* ^/(?!grafana/).*?\.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|otf|svg|eot)$ {
            expires 10m;
            proxy_cache static_cache;
            proxy_pass http://client;
        }

        location / {
            proxy_pass http://client;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|ttf|otf|svg|eot)$ {
            expires 10m;
            proxy_cache static_cache;
            proxy_pass http://client;
        }
    }
}
