name: Pull Request CI

on:
  pull_request:
    branches:
      - main

jobs:
  client:
    name: Client Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache Node.js modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('client/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install client dependencies
        run: |
          cd client
          yarn install

      - name: Format and test client
        run: |
          cd client
          yarn run cicd-format-and-test

  server:
    name: Server Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cache .NET packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-dotnet-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore, build, and test
        run: |
          cd server-test
          dotnet restore --force --no-cache
          dotnet build
          dotnet test --no-restore --no-build

      - name: Restore tool
        run: dotnet tool restore

      - name: Run C# formatter
        run: dotnet csharpier .

  check-changes:
    name: Check for Unstaged Changes
    needs: [client, server]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Check for unstaged changes
        run: |
          if ! git diff --exit-code; then
            echo "There are unstaged changes. Please stage them before committing."
            exit 1
          fi
