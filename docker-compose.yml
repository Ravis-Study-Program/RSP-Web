services:
  nginx:
    container_name: nginx
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - client
    networks:
      - client-server

  client:
    container_name: client
    build:
      context: ./client
      dockerfile: Dockerfile
    volumes:
      - ./client/src/generated/api:/app/src/generated/api
    depends_on:
      - server
    networks:
      - client-server

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile
    depends_on:
      - postgres
    networks:
      - client-server

  postgres:
    container_name: postgres
    image: postgres:latest
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - client-server

networks:
  client-server:
    driver: bridge

volumes:
  postgres_data:
