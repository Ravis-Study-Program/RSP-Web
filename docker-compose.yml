version: "3.8"

services:
  client:
    container_name: client
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - node_modules:/usr/src/app/node_modules
    environment:
      NODE_ENV: development
      VITE_APP_AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      VITE_APP_AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      VITE_APP_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      VITE_APP_AUTH0_REDIRECT_URI: ${AUTH0_REDIRECT_URI}
      VITE_APP_CLIENT_URL: ${CLIENT_URL}
      VITE_APP_SERVER_URL: ${SERVER_URL}
      VITE_APP_CLIENT_PORT: ${CLIENT_PORT}
      VITE_APP_SERVER_PORT: ${SERVER_PORT}
    depends_on:
      - postgres
    networks:
      - client-server

  api:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:8080"
    depends_on:
      - postgres
    networks:
      - client-server

  postgres:
    container_name: postgres
    image: postgres:latest
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    networks:
      - client-server
    mem_limit: 2g
    mem_reservation: 1g 

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "8080:80"
    volumes:
      - /var/lib/pgadmin:/var/lib/pgadmin
    networks:
      - client-server
    mem_limit: 2g
    mem_reservation: 1g 

networks:
  client-server:
    driver: bridge

volumes:
  node_modules:
